name: CI
on:
  push:
  pull_request:
jobs:
  verify:
    strategy:
      matrix:
        node: ['20.x', '22.x']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: node --check src/cli.mjs
      - run: npm run package-shape
      - run: npm run smoke
