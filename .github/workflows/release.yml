name: Release
on:
  workflow_dispatch:
    inputs:
      version:
        description: SemVer version to publish
        required: true
        type: string
permissions:
  contents: write
  id-token: write
jobs:
  publish:
    if: ${{ inputs.version != '' && github.repository == 'replynodes/brand-kit' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/v${{ inputs.version }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          registry-url: https://registry.npmjs.org
      - name: Verify reviewed tag and package
        env:
          VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          case "$VERSION" in
            ''|*[!0-9A-Za-z.+-]*|.*|*-|*.) exit 1 ;;
          esac
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then exit 1; fi
          expected_tag="v$VERSION"
          git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
          test "$(git rev-parse --abbrev-ref HEAD)" = "HEAD"
          git show-ref --verify --quiet "refs/tags/$expected_tag"
          tag_commit="$(git rev-parse "refs/tags/$expected_tag^{commit}")"
          test "$(git rev-parse HEAD)" = "$tag_commit"
          main_commit="$(git rev-parse refs/remotes/origin/main^{commit})"
          git merge-base --is-ancestor "$tag_commit" "$main_commit"
          test -z "$(git status --porcelain=v1)"
          node --input-type=module -e 'import fs from "node:fs"; const p = JSON.parse(fs.readFileSync("package.json", "utf8")); if (p.version !== process.env.VERSION) process.exit(1)'
          grep -Fx -- "## $VERSION" CHANGELOG.md
          test "$(git rev-parse "refs/tags/$expected_tag^{commit}")" = "$tag_commit"
      - run: npm ci
      - name: Create and verify GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          tag="v$VERSION"
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$(git rev-parse HEAD)" --title "$tag" --generate-notes
          test "$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)" = "$tag"
      - run: npm publish --provenance --access public
